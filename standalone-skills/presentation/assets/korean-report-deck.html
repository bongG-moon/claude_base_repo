<body>
<main id="workspace">
  <div id="stage" aria-label="슬라이드 발표 영역">
    <div id="slide-holder"><div id="slides">

<!-- 각 슬라이드 section을 이 영역에 넣는다 -->

    </div></div>
  </div>
  <aside id="notes-panel" aria-label="발표자 메모" aria-hidden="true">
    <button id="notes-close" title="메모 닫기" aria-label="메모 닫기">×</button>
    <span class="note-status">발표자 메모 / 화면 본문과 분리</span>
    <h2 id="note-title"></h2>
    <div id="notes-content"></div>
    <p id="note-source" class="note-source"></p>
  </aside>
</main>
<nav id="toolbar" aria-label="발표 제어">
  <div class="group">
    <span class="chrome-title">발표자료</span>
    <span class="version-badge">v1.0</span>
    <button id="prev" class="icon-button" aria-label="이전 페이지" title="이전 (←)">‹</button>
    <span id="position">1 / 3</span>
    <button id="next" class="icon-button" aria-label="다음 페이지" title="다음 (→)">›</button>
    <div class="nav-numbers" aria-label="페이지 바로가기">
      <button data-goto="P01" aria-label="1페이지">1</button>
      <button data-goto="P02" aria-label="2페이지">2</button>
      <button data-goto="P03" aria-label="3페이지">3</button>
    </div>
  </div>
  <div class="group tools">
    <button id="overview-toggle" title="전체 보기 (G)">전체 보기</button>
    <button id="notes-toggle" aria-pressed="false" title="발표 메모 (N)">발표 메모</button>
    <button id="edit-toggle" aria-pressed="false" title="문구 편집 (E)">문구 편집</button>
    <button id="save-html" title="편집 내용을 반영한 HTML 저장">수정본 저장</button>
    <button id="print" title="현재 범위 인쇄">인쇄</button>
    <button id="fullscreen" title="전체 화면 (F)">전체 화면</button>
    <button id="help" title="단축키 도움말" aria-label="단축키 도움말">?</button>
    <span id="dirty" aria-live="polite"></span>
  </div>
</nav>

  <div id="overview-grid"></div>
</div>

<script>
(() => {
  'use strict';
  const $ = (s, root = document) => root.querySelector(s);
  const allSlides = Array.from(document.querySelectorAll('#slides > .slide'));
  const ids = allSlides.map(s => s.dataset.slide);
  const titles = allSlides.map(s => $('h1', s).textContent.trim());
  const refreshTitles = () => allSlides.forEach((s, i) => { titles[i] = $('h1', s).textContent.trim(); });
  const notesData = JSON.parse($('#deck-notes').textContent);
  const stage = $('#stage');
  let current = 0, editing = false, dirty = false, toastTimer = null;
  const filtered = () => allSlides.filter(s => !document.body.classList.contains('main-only') || s.dataset.kind === 'main');
  const toast = text => {
    const el = $('#toast'); el.textContent = text; el.classList.add('visible');
    window.clearTimeout(toastTimer); toastTimer = window.setTimeout(() => el.classList.remove('visible'), 3200);
  };
  function fit() {
    $('#workspace').style.bottom = (document.body.classList.contains('chrome-hidden') ? 0 : $('#toolbar').offsetHeight) + 'px';
    const r = stage.getBoundingClientRect();
    const pad = r.width < 700 ? 12 : 32;
    const s = Math.max(0.04, Math.min((r.width - pad) / 1600, (r.height - pad) / 900));
    $('#slide-holder').style.setProperty('--s', String(s));
    if ($('#overview').classList.contains('is-open')) resizeThumbs();
  }
  function updateNotes() {
    refreshTitles();
    const id = ids[current], data = notesData[id];
    $('#note-title').textContent = titles[current];
    $('#notes-content').innerHTML = data && data.html ? data.html : '<p>발표 메모가 없습니다.</p>';
    $('#note-source').textContent = '기준: ' + (data ? data.source : 'v1.0');
  }
  function show(index, writeHash = true) {
    if (index < 0 || index >= allSlides.length) return;
    current = index;
    allSlides.forEach((slide, i) => {
      slide.classList.toggle('active', i === index);
      slide.setAttribute('aria-hidden', i === index ? 'false' : 'true');
    });
    const list = filtered(), local = list.indexOf(allSlides[index]);
    $('#position').textContent = `${local + 1} / ${list.length}`;
    $('#prev').disabled = local <= 0;
    $('#next').disabled = local >= list.length - 1;
    document.querySelectorAll('[data-goto]').forEach(btn => {
      const active = btn.dataset.goto === ids[index];
      btn.setAttribute('aria-pressed', String(active));
      active ? btn.setAttribute('aria-current', 'page') : btn.removeAttribute('aria-current');
    });
    $('#status').textContent = `${index + 1}페이지. ${titles[index]}`;
    updateNotes();
    if (writeHash) { try { history.replaceState(null, '', '#' + ids[index]); } catch (_) {} }
  }
  function next(delta) {
    const visible = filtered(), i = visible.indexOf(allSlides[current]);
    const target = visible[Math.max(0, Math.min(i + delta, visible.length - 1))];
    show(allSlides.indexOf(target));
  }
  function toggleNotes() {
    const active = document.body.classList.toggle('notes-open');
    $('#notes-toggle').setAttribute('aria-pressed', String(active));
    $('#notes-panel').setAttribute('aria-hidden', String(!active)); fit();
  }
  function resizeThumbs() {
    document.querySelectorAll('.thumb-stage').forEach(el => {
      const slide = $('.slide', el);
      if (slide) slide.style.transform = `scale(${el.clientWidth / 1600})`;
    });
  }
  function openOverview() {
    refreshTitles();
    const grid = $('#overview-grid'); grid.innerHTML = '';
    filtered().forEach(slide => {
      const i = allSlides.indexOf(slide), button = document.createElement('button');
      button.type = 'button'; button.className = 'thumbnail-button' + (i === current ? ' selected' : '');
      button.setAttribute('aria-label', `${i+1}페이지 ${titles[i]}로 이동`);
      const preview = document.createElement('div'); preview.className = 'thumb-stage';
      const clone = slide.cloneNode(true); clone.classList.add('active'); clone.setAttribute('aria-hidden','true');
      clone.querySelectorAll('[data-edit]').forEach(n => {n.removeAttribute('contenteditable'); n.removeAttribute('tabindex');});
      clone.querySelectorAll('[id]').forEach(n => n.removeAttribute('id'));
      preview.appendChild(clone);
      const caption = document.createElement('div'); caption.className = 'thumb-caption';
      const label = document.createElement('span'); label.textContent = titles[i];
      const count = document.createElement('strong'); count.textContent = `${i+1} / ${allSlides.length}`;
      caption.append(label,count); button.append(preview,caption);
      button.addEventListener('click', () => {show(i); closeOverview();}); grid.appendChild(button);
    });
    $('#workspace').inert = true; $('#toolbar').inert = true;
    $('#overview').classList.add('is-open'); $('#overview').setAttribute('aria-hidden','false');
    resizeThumbs(); $('#overview-close').focus();
  }
  function closeOverview() {
    $('#workspace').inert=false; $('#toolbar').inert=false;
    $('#overview').classList.remove('is-open'); $('#overview').setAttribute('aria-hidden','true'); $('#overview-toggle').focus();
  }
  function toggleEditing() {
    editing = !editing; document.body.classList.toggle('editing', editing);
    document.querySelectorAll('#slides [data-edit]').forEach(el => {
      if (editing) {el.setAttribute('contenteditable','true'); el.setAttribute('spellcheck','false');}
      else el.removeAttribute('contenteditable');
    });
    $('#edit-toggle').setAttribute('aria-pressed', String(editing));
    $('#edit-toggle').textContent = editing ? '편집 종료' : '문구 편집';
    toast(editing ? '점선으로 표시된 문구를 클릭해 수정하세요.' : '발표 모드로 돌아왔습니다.');
  }
  function downloadHTML() {
    const root = document.documentElement.cloneNode(true);
    root.querySelector('body').classList.remove('editing','notes-open','chrome-hidden');
    root.querySelector('#workspace').removeAttribute('inert'); root.querySelector('#toolbar').removeAttribute('inert');
    root.querySelectorAll('[contenteditable]').forEach(el => el.removeAttribute('contenteditable'));
    root.querySelectorAll('#slides > .slide').forEach((el,i) => {el.classList.toggle('active',i===0); el.setAttribute('aria-hidden',i===0?'false':'true');});
    root.querySelector('#overview').classList.remove('is-open'); root.querySelector('#overview').setAttribute('aria-hidden','true');
    root.querySelector('#overview-grid').innerHTML = '';
    root.querySelector('#toast').classList.remove('visible'); root.querySelector('#toast').textContent = '';
    root.querySelector('#dirty').textContent = '';
    root.querySelector('#edit-toggle').setAttribute('aria-pressed','false'); root.querySelector('#edit-toggle').textContent = '문구 편집';
    root.querySelector('#notes-toggle').setAttribute('aria-pressed','false'); root.querySelector('#notes-panel').setAttribute('aria-hidden','true');
    const blob = new Blob(['<!DOCTYPE html>\n' + root.outerHTML], {type:'text/html;charset=utf-8'});
    const url = URL.createObjectURL(blob), a=document.createElement('a');
    a.href=url; a.download='HTML_Deck_edited.html'; a.click();
    setTimeout(() => URL.revokeObjectURL(url),5000); dirty=false; $('#dirty').textContent='';
    toast('수정 내용이 포함된 독립 HTML을 저장했습니다.');
  }
  async function toggleFullscreen() {
    try {if(document.fullscreenElement) await document.exitFullscreen(); else await document.documentElement.requestFullscreen();}
    catch (_) {toast('전체 화면이 제한될 수 있습니다.');}
    fit();
  }
  $('#prev').addEventListener('click', () => next(-1));
  $('#next').addEventListener('click', () => next(1));
  document.querySelectorAll('[data-goto]').forEach(b => b.addEventListener('click', () => show(ids.indexOf(b.dataset.goto))));
  $('#notes-toggle').addEventListener('click', toggleNotes);
  $('#notes-close').addEventListener('click', toggleNotes);
  $('#overview-toggle').addEventListener('click', openOverview);
  $('#overview-close').addEventListener('click', closeOverview);
  $('#edit-toggle').addEventListener('click', toggleEditing);
  $('#save-html').addEventListener('click', downloadHTML);
  $('#print').addEventListener('click', () => window.print());
  $('#fullscreen').addEventListener('click', toggleFullscreen);
  $('#help').addEventListener('click', () => toast('← → 이동 / 1~' + Math.min(9, allSlides.length) + ' 바로가기 / Home 처음 / End 마지막 / G 전체 / N 메모 / E 편집 / F 전체화면 / H 도구숨김'));
  document.addEventListener('keydown', e => {
    const typing = e.target.closest('[contenteditable="true"],input,textarea,select');
    if (e.key === 'Escape') {
      if ($('#overview').classList.contains('is-open')) closeOverview();
      else if (editing) { e.target.blur(); toggleEditing(); }
      else if (document.body.classList.contains('notes-open')) toggleNotes();
      else if (document.body.classList.contains('chrome-hidden')) { document.body.classList.remove('chrome-hidden'); fit(); }
      return;
    }
    if (typing || e.ctrlKey || e.metaKey || e.altKey || $('#overview').classList.contains('is-open')) return;
    const k = e.key.toLowerCase();
    if (['arrowright','pagedown',' '].includes(k)) { e.preventDefault(); next(1); }
    else if (['arrowleft','pageup'].includes(k)) { e.preventDefault(); next(-1); }
    else if (k === 'home') { e.preventDefault(); show(0); }
    else if (k === 'end') { e.preventDefault(); show(allSlides.indexOf(filtered().at(-1))); }
    else if (/^[1-9]$/.test(k) && Number(k) <= allSlides.length) { e.preventDefault(); show(Number(k) - 1); }
    else if (k === 'n') toggleNotes();
    else if (k === 'g') openOverview();
    else if (k === 'e') toggleEditing();
    else if (k === 'f') toggleFullscreen();
    else if (k === 'h') { document.body.classList.toggle('chrome-hidden'); fit(); }
  });
  $('#slides').addEventListener('input', e => { if (e.target.closest('[data-edit]')) { dirty = true; $('#dirty').textContent = '미저장 변경'; updateNotes(); } });
  $('#slides').addEventListener('paste', e => {
    if (!editing || !e.target.closest('[data-edit]')) return;
    e.preventDefault();
    const txt = (e.clipboardData || window.clipboardData).getData('text/plain');
    const sel = window.getSelection(); if (!sel.rangeCount) return;
    const range = sel.getRangeAt(0); range.deleteContents();
    const node = document.createTextNode(txt); range.insertNode(node);
    range.setStartAfter(node); range.collapse(true);
    sel.removeAllRanges(); sel.addRange(range);
    dirty = true; $('#dirty').textContent = '미저장 변경';
  });
  let touchStart = null;
  stage.addEventListener('pointerdown', e => { if (e.pointerType === 'touch' && !editing) touchStart = {x: e.clientX, y: e.clientY}; });
  stage.addEventListener('pointerup', e => {
    if (!touchStart) return;
    const dx = e.clientX - touchStart.x, dy = e.clientY - touchStart.y;
    touchStart = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) next(dx < 0 ? 1 : -1);
  });
  window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
  window.addEventListener('resize', fit);
  new ResizeObserver(fit).observe(stage);
  window.addEventListener('hashchange', () => { const i = ids.indexOf(location.hash.slice(1).toUpperCase()); if (i >= 0) show(i, false); });
  const initial = ids.indexOf(location.hash.slice(1).toUpperCase());
  show(initial >= 0 ? initial : 0, false);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit); else fit();
  window.deck = { show, ids: ids.slice(), fit, get current() { return ids[current]; }, version: '1.0' };
})();
</script>
